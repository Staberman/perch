name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Test
        run: |
          (cd agent && bun install --frozen-lockfile)
          bun test agent npm
          swift run PerchCoreTests

      - name: Build
        run: bun scripts/release.ts --version "${GITHUB_REF_NAME#v}"

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # The binaries first, so the launcher never points at versions that don't exist yet.
          for package in perch-darwin-arm64 perch-darwin-x64 perch; do
            npm publish --access public "dist/npm/$package"
          done

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for package in perch-darwin-arm64 perch-darwin-x64; do
            tar -czf "dist/$package.tar.gz" -C "dist/npm/$package" bin
          done
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --generate-notes
