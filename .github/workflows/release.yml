name: Release

# Tags publish; pull requests that touch what ships only build, so a broken build shows up before tagging.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "agent/**"
      - "npm/**"
      - "shared/**"
      - "Sources/**"
      - "Package.swift"
      - "scripts/release.ts"
      - ".github/workflows/release.yml"

permissions:
  contents: write
  # npm's Trusted Publishing: each package trusts this workflow, so publishing needs no token.
  id-token: write

jobs:
  release:
    runs-on: macos-15
    env:
      PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm with Trusted Publishing
        run: npm install -g npm@^11.5.1

      - name: Test
        run: |
          (cd agent && bun install --frozen-lockfile)
          bun test agent npm
          swift run TomariCoreTests

      - name: Build
        run: |
          if [ "$PUBLISH" = true ]; then version="${GITHUB_REF_NAME#v}"; else version=0.0.0-ci; fi
          bun scripts/release.ts --version "$version"

      - name: Publish to npm
        if: env.PUBLISH == 'true'
        run: |
          # The binaries first, so the launcher never points at versions that don't exist yet.
          for package in tomari-darwin-arm64 tomari-darwin-x64 tomari; do
            npm publish --access public "dist/npm/$package"
          done

      - name: GitHub release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for package in tomari-darwin-arm64 tomari-darwin-x64; do
            tar -czf "dist/$package.tar.gz" -C "dist/npm/$package" bin
          done
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --generate-notes
